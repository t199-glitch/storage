<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成語填字遊戲</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

        :root {
            --bg-color: #fdf6e3; /* 米黃宣紙色 */
            --text-color: #2c2c2c;
            --red: #d32f2f;
            --card-bg: #f4e8c1; /* 淡黃底 */
            --border-color: #8b7355;
            --success-color: #2e8b57;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none; /* Prevent scrolling while dragging on touch */
        }

        .header {
            margin-top: 20px;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin: 10px 0;
            letter-spacing: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .stats {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 20px;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
        }

        /* 顯示區 (上方) */
        .idiom-display {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        .char-fixed {
            font-size: 4rem;
            font-weight: bold;
            width: 80px;
            text-align: center;
            line-height: 80px;
        }

        /* 米字格空格 */
        .drop-zone {
            width: 80px;
            height: 80px;
            border: 3px solid var(--red);
            position: relative;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            box-sizing: border-box;
        }

        .drop-zone::before, .drop-zone::after {
            content: '';
            position: absolute;
            pointer-events: none;
            opacity: 0.3;
        }

        .drop-zone::before {
            top: 50%; left: 0; right: 0;
            border-top: 1px dashed var(--red);
        }

        .drop-zone::after {
            left: 50%; top: 0; bottom: 0;
            border-left: 1px dashed var(--red);
        }

        .drop-zone .diagonal-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, transparent 48%, rgba(211,47,47,0.3) 49%, rgba(211,47,47,0.3) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(211,47,47,0.3) 49%, rgba(211,47,47,0.3) 51%, transparent 52%);
            pointer-events: none;
        }

        /* 答對時的字卡樣式（像印章） */
        .drop-zone .char-card {
            background: transparent;
            border: none;
            box-shadow: none;
            color: var(--red);
            font-size: 3.5rem;
            font-weight: bold;
            padding: 0;
            margin: 0;
            cursor: default;
            transform: none;
            position: relative;
            z-index: 2;
        }

        .drop-zone.error {
            background-color: rgba(211, 47, 47, 0.3);
        }

        /* 選項區 (下方) */
        .pool-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            min-height: 200px;
        }

        .char-card {
            width: 60px;
            height: 60px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-color);
            cursor: grab;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            user-select: none;
            touch-action: none; /* Required for custom touch events */
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .char-card:active {
            cursor: grabbing;
        }

        .char-card.dragging {
            position: fixed;
            z-index: 1000;
            pointer-events: none; /* Let pointer events pass through to drop zones */
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            transform: scale(1.1);
            opacity: 0.9;
        }
        
        .char-card.placeholder {
            visibility: hidden;
        }

        /* 資訊與過關區 */
        .message-box {
            margin-top: 20px;
            padding: 15px 30px;
            background: #fff;
            border: 2px dashed var(--success-color);
            border-radius: 8px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .message-box.show {
            display: flex;
            animation: fadeIn 0.5s;
        }

        .meaning {
            font-size: 1.2rem;
            color: #444;
        }

        .btn {
            background-color: var(--red);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #b71c1c;
        }

        /* 最終過關畫面 */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(253, 246, 227, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal h2 {
            font-size: 2.5rem;
            color: var(--red);
            margin-top: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手機版調整 */
        @media (max-width: 600px) {
            .char-fixed { font-size: 3rem; width: 60px; line-height: 60px; }
            .drop-zone { width: 60px; height: 60px; }
            .char-card { width: 50px; height: 50px; font-size: 1.6rem; }
            .pool-area { padding: 10px; gap: 8px; }
        }

        /* 回到大地圖按鈕 */
        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 900;
            background: rgba(255,255,255,0.7); border: 1px solid #8b7355;
            color: #5a3e1b; padding: 7px 14px; border-radius: 20px;
            font-family: inherit; font-size: 0.85rem; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s; backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background: #f4e8c1; border-color: #5a3e1b; }
    </style>
</head>
<body>

    <a class="back-btn" href="../大冒險地圖/index.html">← 回到大地圖</a>

    <div class="header">
        <h1>成語填字</h1>
        <div class="stats">第 <span id="current-question-num">1</span> / 5 題</div>
    </div>

    <div class="game-area">
        <div class="idiom-display" id="idiom-display">
            <!-- 題目由 JS 生成 -->
        </div>

        <div class="message-box" id="message-box">
            <h3 style="margin: 0; color: var(--success-color);">✓ 答對了！</h3>
            <div class="meaning" id="idiom-meaning"></div>
            <button class="btn" id="next-btn" onclick="nextQuestion()">下一題</button>
        </div>

        <div class="pool-area" id="pool-area">
            <!-- 字卡由 JS 生成 -->
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>挑戰完成！</h2>
            <p style="font-size: 1.5rem; margin-bottom: 30px;">您已完成 5 題成語填字。</p>
            <button class="btn" onclick="startGame()">重新挑戰</button>
        </div>
    </div>

    <script>
        const QUESTIONS_DB = [
            { 成語: '一鳴驚人', 缺字: [1, 2], 答案: ['鳴', '驚'], 意思: '比喻平時默默無聞，突然有驚人表現。' },
            { 成語: '風花雪月', 缺字: [1, 3], 答案: ['花', '月'], 意思: '原指四時景色，後比喻浮華空洞的詩文。' },
            { 成語: '三番五次', 缺字: [1, 3], 答案: ['番', '次'], 意思: '形容次數很多。' },
            { 成語: '一字千金', 缺字: [1, 3], 答案: ['字', '金'], 意思: '形容文字價值極高。' },
            { 成語: '畫龍點睛', 缺字: [1, 3], 答案: ['龍', '睛'], 意思: '比喻在關鍵處點明要旨。' },
            { 成語: '掩耳盜鈴', 缺字: [1, 3], 答案: ['耳', '鈴'], 意思: '比喻自欺欺人。' },
            { 成語: '守株待兔', 缺字: [1, 3], 答案: ['株', '兔'], 意思: '比喻拘泥守成，不知變通，或妄想不勞而獲。' },
            { 成語: '亡羊補牢', 缺字: [1, 3], 答案: ['羊', '牢'], 意思: '比喻犯錯後及時更正，尚能補救。' },
            { 成語: '拔苗助長', 缺字: [1, 3], 答案: ['苗', '長'], 意思: '比喻為求速成而未顧及事物發展的客觀規律，結果反而有害。' },
            { 成語: '對牛彈琴', 缺字: [1, 3], 答案: ['牛', '琴'], 意思: '比喻對不懂道理的人講道理。' },
            { 成語: '狐假虎威', 缺字: [1, 3], 答案: ['假', '威'], 意思: '比喻藉著有權者的威勢欺壓他人。' },
            { 成語: '破釜沉舟', 缺字: [1, 3], 答案: ['釜', '舟'], 意思: '比喻下定決心，不顧一切幹到底。' },
            { 成語: '畫蛇添足', 缺字: [1, 3], 答案: ['蛇', '足'], 意思: '比喻多此一舉，反而壞事。' },
            { 成語: '杯弓蛇影', 缺字: [1, 3], 答案: ['弓', '影'], 意思: '比喻疑神疑鬼，自相驚擾。' },
            { 成語: '井底之蛙', 缺字: [1, 3], 答案: ['底', '蛙'], 意思: '比喻見識淺薄的人。' }
        ];

        const DISTRACTORS_LIST = "春夏天和山水風雲日月星辰龍虎馬牛羊花草樹木金火土大小多少明暗善惡美醜東西南北前後左右";

        let gameQuestions = [];
        let currentQuestionIndex = 0;
        let correctlyFilled = 0;

        // Custom Drag & Drop Variables
        let draggedEl = null;
        let placeholder = null;
        let startX = 0, startY = 0;
        let initialLeft = 0, initialTop = 0;

        const idiomDisplayEl = document.getElementById('idiom-display');
        const poolAreaEl = document.getElementById('pool-area');
        const messageBoxEl = document.getElementById('message-box');
        const meaningEl = document.getElementById('idiom-meaning');
        const overlayEl = document.getElementById('overlay');
        const qNumEl = document.getElementById('current-question-num');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startGame() {
            // 選出 5 題
            const shuffledDB = shuffle([...QUESTIONS_DB]);
            gameQuestions = shuffledDB.slice(0, 5);
            currentQuestionIndex = 0;
            overlayEl.classList.remove('show');
            loadQuestion();
        }

        function loadQuestion() {
            messageBoxEl.classList.remove('show');
            idiomDisplayEl.innerHTML = '';
            poolAreaEl.innerHTML = '';
            correctlyFilled = 0;
            qNumEl.textContent = currentQuestionIndex + 1;

            const q = gameQuestions[currentQuestionIndex];
            
            // 建立顯示區
            const chars = q.成語.split('');
            chars.forEach((char, index) => {
                if (q.缺字.includes(index)) {
                    const zone = document.createElement('div');
                    zone.className = 'drop-zone';
                    zone.dataset.char = char;
                    zone.innerHTML = '<div class="diagonal-bg"></div>';
                    idiomDisplayEl.appendChild(zone);
                } else {
                    const fixed = document.createElement('div');
                    fixed.className = 'char-fixed';
                    fixed.textContent = char;
                    idiomDisplayEl.appendChild(fixed);
                }
            });

            // 準備字卡池 (2個正解 + 13個干擾)
            let cards = [...q.答案];
            let distractorArray = DISTRACTORS_LIST.split('');
            distractorArray = shuffle(distractorArray).filter(c => !cards.includes(c)); // 排除正解
            
            for(let i=0; i<13; i++){
                cards.push(distractorArray[i]);
            }
            cards = shuffle(cards);

            // 建立字卡
            cards.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.textContent = char;
                card.addEventListener('pointerdown', handlePointerDown);
                poolAreaEl.appendChild(card);
            });
        }

        // ====== 拖曳邏輯 (滑鼠/觸控共用 Pointer Event) ======
        function handlePointerDown(e) {
            // 左鍵或觸控
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (this.classList.contains('success')) return;

            draggedEl = this;
            const rect = draggedEl.getBoundingClientRect();

            // 建立佔位元素
            placeholder = document.createElement('div');
            placeholder.className = 'char-card placeholder';
            draggedEl.parentNode.insertBefore(placeholder, draggedEl);

            // 設定拖曳狀態
            draggedEl.classList.add('dragging');
            
            // 固定位置以便跟隨游標
            draggedEl.style.left = rect.left + 'px';
            draggedEl.style.top = rect.top + 'px';
            draggedEl.style.width = rect.width + 'px';
            draggedEl.style.height = rect.height + 'px';

            startX = e.clientX;
            startY = e.clientY;
            initialLeft = rect.left;
            initialTop = rect.top;

            // 綁定全域事件 (要設定 passive: false 以阻擋觸控捲動)
            document.addEventListener('pointermove', handlePointerMove, {passive: false});
            document.addEventListener('pointerup', handlePointerUp);
            document.addEventListener('pointercancel', handlePointerUp);
            
            // 允許拖曳時不會觸發原生的 drag
            draggedEl.ondragstart = () => false;
        }

        function handlePointerMove(e) {
            if (!draggedEl) return;
            // 如果是觸控，阻止畫面捲動
            if (e.pointerType === 'touch') {
                e.preventDefault(); 
            }

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            draggedEl.style.left = (initialLeft + dx) + 'px';
            draggedEl.style.top = (initialTop + dy) + 'px';
        }

        function handlePointerUp(e) {
            if (!draggedEl) return;

            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            document.removeEventListener('pointercancel', handlePointerUp);

            // 尋找游標下的目標
            draggedEl.style.visibility = 'hidden';
            const target = document.elementFromPoint(e.clientX, e.clientY);
            draggedEl.style.visibility = 'visible';

            const dropZone = target ? target.closest('.drop-zone') : null;
            const currentQ = gameQuestions[currentQuestionIndex];

            if (dropZone && dropZone.children.length === 1 /* 只有 bg */) {
                const expectedChar = dropZone.dataset.char;
                if (draggedEl.textContent === expectedChar) {
                    // 放對了
                    dropZone.appendChild(draggedEl);
                    resetCardStyle(draggedEl);
                    draggedEl.classList.add('success');
                    draggedEl.removeEventListener('pointerdown', handlePointerDown);
                    placeholder.remove();
                    
                    playDingSound();
                    correctlyFilled++;
                    
                    if (correctlyFilled === currentQ.缺字.length) {
                        showSuccess(currentQ);
                    }
                } else {
                    // 放錯了
                    handleErrorDrop(dropZone);
                }
            } else {
                // 放空處，彈回
                returnToOriginal();
            }

            draggedEl = null;
            placeholder = null;
        }

        function resetCardStyle(el) {
            el.classList.remove('dragging');
            el.style.position = '';
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
        }

        function returnToOriginal() {
            // 簡單的彈回動畫
            draggedEl.style.transition = 'all 0.2s ease-out';
            const rect = placeholder.getBoundingClientRect();
            draggedEl.style.left = rect.left + 'px';
            draggedEl.style.top = rect.top + 'px';
            
            setTimeout(() => {
                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.replaceChild(draggedEl, placeholder);
                }
                resetCardStyle(draggedEl);
                draggedEl.style.transition = 'transform 0.1s, box-shadow 0.1s';
            }, 200);
        }

        function handleErrorDrop(dropZone) {
            dropZone.classList.add('error');
            setTimeout(() => dropZone.classList.remove('error'), 200);
            returnToOriginal();
        }

        function showSuccess(q) {
            meaningEl.textContent = `意思：${q.意思}`;
            messageBoxEl.classList.add('show');
            if (currentQuestionIndex === 4) {
                document.getElementById('next-btn').textContent = "查看結果";
            } else {
                document.getElementById('next-btn').textContent = "下一題";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 5) {
                loadQuestion();
            } else {
                // 頒發「成語之印」憑證
                localStorage.setItem('cert_idiom', '1');
                overlayEl.classList.add('show');
            }
        }

        function playDingSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                // Ignore audio errors (e.g. autoplay policies)
            }
        }

        // 禁止 body 捲動以防觸控拖曳時頁面滑動
        document.body.addEventListener('touchmove', function(e) {
            if (e.target.classList.contains('char-card')) {
                e.preventDefault();
            }
        }, { passive: false });

        // 啟動遊戲
        startGame();
    </script>
</body>
</html>
