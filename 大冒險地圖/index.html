<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傳說之晶片 · 大冒險地圖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #0d0a06;
            overflow: hidden;
            font-family: 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
            color: #fff;
            user-select: none;
        }

        /* ══════════════════════════════
           開場封面
        ══════════════════════════════ */
        #splash {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            background: #000;
            transition: opacity 0.8s ease;
        }
        #splash.fade-out { opacity: 0; pointer-events: none; }
        #splash.hidden { display: none; }

        #splash img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ══════════════════════════════
           大地圖主畫面
        ══════════════════════════════ */
        #map-screen {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            background: #0d0a06;
            opacity: 0; transition: opacity 0.8s ease;
        }
        #map-screen.visible { opacity: 1; }

        /* 地圖容器：保持圖片比例 */
        #map-container {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            /* 底圖原始比例約 16:9 */
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
        }

        #map-bg {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ══════════════════════════════
           右上角資訊欄
        ══════════════════════════════ */
        #hud {
            position: absolute; top: 3%; right: 2%;
            display: flex; align-items: center; gap: 10px;
            z-index: 10;
        }
        #cert-hud {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(245,200,66,0.5);
            color: #f5c842; font-size: 0.85rem; font-weight: 700;
            padding: 5px 13px; border-radius: 20px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #clear-btn {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.25);
            color: #aaa; font-size: 0.78rem;
            padding: 5px 12px; border-radius: 20px;
            cursor: pointer; font-family: inherit;
            backdrop-filter: blur(4px);
            transition: all 0.2s; white-space: nowrap;
        }
        #clear-btn:hover { background: rgba(231,76,60,0.3); border-color: #e74c3c; color: #e74c3c; }

        /* ══════════════════════════════
           透明熱區
        ══════════════════════════════ */
        .hotzone {
            position: absolute;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.25s, box-shadow 0.25s;
            display: flex; justify-content: flex-start; align-items: flex-end;
        }
        .hotzone:hover {
            background: rgba(255,255,255,0.10);
            box-shadow: 0 0 24px 6px rgba(255,255,200,0.2);
        }

        /* 歷代書院：左移5% → left:9% */
        #hz-dynasty {
            top: 32%; left: 9%;
            width: 22%; height: 13%;
        }

        /* 成語林閣 - 右中（不變） */
        #hz-idiom {
            top: 34%; left: 73%;
            width: 23%; height: 13%;
        }

        /* 魔王之城：下移15% → top:84%，右移5% → left:8% */
        #hz-warrior {
            top: 84%; left: 8%;
            width: 24%; height: 13%;
        }

        /* 三印封門：左移5% → left:40% */
        #hz-gate {
            top: 60%; left: 40%;
            width: 22%; height: 13%;
        }

        /* ✓ 完成印章 */
        .done-stamp {
            position: absolute;
            /* 調整至適當位置，避免遮擋關卡名稱（放置於熱區右上角） */
            top: 5px; right: 5px; left: auto;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            filter: drop-shadow(0 2px 6px rgba(0,180,0,0.9));
            animation: stamp-pop 0.4s ease-out;
            pointer-events: none;
            z-index: 5;
            line-height: 1;
        }
        @keyframes stamp-pop {
            0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
            60%  { transform: scale(1.25) rotate(5deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* ══════════════════════════════
           通關大門 Modal
        ══════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.82); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 500; padding: 16px;
        }
        .modal-overlay.active { display: flex; }

        .gate-modal {
            background: linear-gradient(160deg, #12122a, #1e1240);
            border: 2px solid #8e44ad;
            border-radius: 20px; padding: 28px 24px 32px;
            width: 100%; max-width: 540px;
            box-shadow: 0 0 60px rgba(142,68,173,0.5);
            position: relative;
        }
        .gate-modal h2 {
            text-align: center; font-size: 1.5rem; color: #f5c842;
            margin-bottom: 6px; letter-spacing: 3px;
        }
        .gate-modal .modal-hint {
            text-align: center; font-size: 0.82rem; color: #888; margin-bottom: 24px;
        }

        /* 凹槽 */
        .slots-row {
            display: flex; gap: 14px; justify-content: center; margin-bottom: 24px;
        }
        .slot { width: 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .slot-label { font-size: 0.78rem; color: #888; letter-spacing: 1px; }
        .slot-well {
            width: 86px; height: 86px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem;
            background: rgba(255,255,255,0.03);
            transition: all 0.2s;
        }
        .slot-well.drag-over { border-color: #f5c842; background: rgba(245,200,66,0.1); }
        .slot-well.filled  { border: 2px solid #27ae60; background: rgba(39,174,96,0.12); }
        .slot-well.error-flash { border-color: #e74c3c; background: rgba(231,76,60,0.15); animation: err-shake 0.35s; }
        @keyframes err-shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-7px); }
            75%     { transform: translateX(7px); }
        }

        .modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 0 18px; }
        .backpack-title { font-size: 0.82rem; color: #888; text-align: center; margin-bottom: 12px; }
        .backpack-row {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; min-height: 66px;
        }

        /* 憑證徽章 */
        .cert-badge {
            width: 76px; height: 76px;
            border-radius: 12px; border: 2px solid #f5c842;
            background: rgba(245,200,66,0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 4px; cursor: grab; font-size: 1.7rem;
            touch-action: none; transition: transform 0.15s;
        }
        .cert-badge span { font-size: 0.58rem; color: #f5c842; letter-spacing: 0.5px; }
        .cert-badge:active { cursor: grabbing; transform: scale(1.06); }
        .cert-badge.dragging-badge {
            position: fixed; z-index: 9999; pointer-events: none;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7);
            transform: scale(1.12); opacity: 0.92;
        }
        .cert-badge.ghost { visibility: hidden; }
        .empty-backpack { color: #555; font-size: 0.88rem; text-align: center; align-self: center; }

        .modal-close-btn {
            position: absolute; top: 12px; right: 16px;
            background: none; border: none; color: #666; font-size: 1.4rem; cursor: pointer;
            transition: color 0.2s;
        }
        .modal-close-btn:hover { color: #ccc; }

        /* ══════════════════════════════
           通關畫面
        ══════════════════════════════ */
        #win-screen {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at 50% 40%, #0a2e0a, #000);
            display: none; justify-content: center; align-items: center;
            flex-direction: column; gap: 22px; z-index: 600;
        }
        #win-screen.active { display: flex; }
        .win-trophy { font-size: 6rem; animation: trophy-bounce 0.8s ease-out; }
        @keyframes trophy-bounce {
            0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
            60%  { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        .win-title { font-size: 2.2rem; font-weight: 900; color: #f5c842; letter-spacing: 4px; text-shadow: 0 0 20px rgba(245,200,66,0.6); }
        .win-time  { font-size: 1.05rem; color: #aaa; letter-spacing: 2px; }
        .win-time span { color: #fff; font-weight: 700; }
        .restart-btn {
            margin-top: 10px;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; padding: 11px 34px; font-size: 0.95rem; font-family: inherit;
            border-radius: 30px; cursor: pointer; letter-spacing: 2px; transition: all 0.2s;
        }
        .restart-btn:hover { background: rgba(255,255,255,0.16); }

        /* 彩帶 */
        .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 599; overflow: hidden; }
        .confetti-particle {
            position: absolute; border-radius: 2px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .slots-row { gap: 8px; }
            .slot { width: 86px; }
            .slot-well { width: 70px; height: 70px; font-size: 1.6rem; }
            .cert-badge { width: 64px; height: 64px; font-size: 1.4rem; }
            #hud { top: 1.5%; right: 1.5%; gap: 6px; }
            #cert-hud, #clear-btn { font-size: 0.72rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <!-- ══ 開場封面 ══ -->
    <div id="splash">
        <img src="開場封面.png" alt="傳說之晶片開場封面">
    </div>

    <!-- ══ 大地圖畫面 ══ -->
    <div id="map-screen">
        <div id="map-container">
            <img id="map-bg" src="底圖.png" alt="大冒險地圖">

            <!-- 右上角 HUD -->
            <div id="hud">
                <div id="cert-hud">持有 <span id="cert-count">0</span> / 3</div>
                <button id="clear-btn" onclick="clearProgress()">🔄 清除進度</button>
            </div>

            <!-- 透明熱區 -->
            <div class="hotzone" id="hz-dynasty"  onclick="gotoGame('../示範1_朝代配對/index.html')"></div>
            <div class="hotzone" id="hz-idiom"    onclick="gotoGame('../示範2_成語填字/index.html')"></div>
            <div class="hotzone" id="hz-warrior"  onclick="gotoGame('../示範3_打怪RPG/index.html')"></div>
            <div class="hotzone" id="hz-gate"     onclick="openGateModal()"></div>
        </div>
    </div>

    <!-- ══ 通關大門 Modal ══ -->
    <div class="modal-overlay" id="gate-modal-overlay">
        <div class="gate-modal">
            <button class="modal-close-btn" onclick="closeGateModal()">✕</button>
            <h2>🚪 三印封門</h2>
            <p class="modal-hint">將持有的憑證拖曳到對應凹槽，集齊三印即可解封</p>

            <div class="slots-row">
                <div class="slot">
                    <div class="slot-label">朝代之印</div>
                    <div class="slot-well" id="slot-dynasty" data-accept="dynasty"
                         ondragover="slotDragOver(event,this)" ondragleave="slotDragLeave(this)" ondrop="slotDrop(event,this)"></div>
                </div>
                <div class="slot">
                    <div class="slot-label">成語之印</div>
                    <div class="slot-well" id="slot-idiom" data-accept="idiom"
                         ondragover="slotDragOver(event,this)" ondragleave="slotDragLeave(this)" ondrop="slotDrop(event,this)"></div>
                </div>
                <div class="slot">
                    <div class="slot-label">勇者之印</div>
                    <div class="slot-well" id="slot-warrior" data-accept="warrior"
                         ondragover="slotDragOver(event,this)" ondragleave="slotDragLeave(this)" ondrop="slotDrop(event,this)"></div>
                </div>
            </div>

            <hr class="modal-divider">
            <p class="backpack-title">🎒 背包</p>
            <div class="backpack-row" id="backpack-row"></div>
        </div>
    </div>

    <!-- ══ 通關畫面 ══ -->
    <div id="win-screen">
        <div class="confetti-wrap" id="confetti-wrap"></div>
        <div class="win-trophy">🏆</div>
        <div class="win-title">冒險完成！</div>
        <div class="win-time">總冒險時長：<span id="win-duration">--</span></div>
        <button class="restart-btn" onclick="restartAdventure()">🔁 再次冒險</button>
    </div>

    <script>
    // ══════════════════════════════
    // 憑證定義
    // ══════════════════════════════
    const CERTS = {
        dynasty:  { key: 'cert_dynasty',  emoji: '📜', name: '朝代之印' },
        idiom:    { key: 'cert_idiom',    emoji: '🖌️', name: '成語之印' },
        warrior:  { key: 'cert_warrior',  emoji: '⚔️', name: '勇者之印' }
    };
    const ZONE_MAP = { dynasty: 'hz-dynasty', idiom: 'hz-idiom', warrior: 'hz-warrior' };

    // ══════════════════════════════
    // 開場封面邏輯
    // ══════════════════════════════
    const splash   = document.getElementById('splash');
    const mapScreen = document.getElementById('map-screen');

    function showSplash() {
        splash.classList.remove('hidden', 'fade-out');
        mapScreen.classList.remove('visible');
    }
    function hideSplash() {
        sessionStorage.setItem('splash_seen', '1');
        splash.classList.add('fade-out');
        setTimeout(() => {
            splash.classList.add('hidden');
            mapScreen.classList.add('visible');
            refreshUI();
        }, 800);
    }

    splash.addEventListener('click', hideSplash);

    // 首次進入記錄冒險開始時間
    if (!localStorage.getItem('adventure_start')) {
        localStorage.setItem('adventure_start', Date.now().toString());
    }

    // 判斷是否要跳過封面
    if (sessionStorage.getItem('splash_seen')) {
        splash.classList.add('hidden');
        mapScreen.classList.add('visible');
        refreshUI();
    }

    // ══════════════════════════════
    // 跳到遊戲（設定 sessionStorage 讓回來後不再顯示封面）
    // ══════════════════════════════
    function gotoGame(url) {
        sessionStorage.setItem('splash_seen', '1');
        window.location.href = url;
    }

    // ══════════════════════════════
    // 更新地圖 UI
    // ══════════════════════════════
    function refreshUI() {
        let count = 0;
        Object.entries(CERTS).forEach(([id, cert]) => {
            const done = !!localStorage.getItem(cert.key);
            if (done) count++;
            const zoneId = ZONE_MAP[id];
            if (!zoneId) return;
            const zone = document.getElementById(zoneId);
            // 移除舊印章
            zone.querySelectorAll('.done-stamp').forEach(el => el.remove());
            if (done) {
                const stamp = document.createElement('div');
                stamp.className = 'done-stamp';
                stamp.textContent = '✅';
                zone.appendChild(stamp);
            }
        });
        document.getElementById('cert-count').textContent = count;
    }

    // ══════════════════════════════
    // 清除進度
    // ══════════════════════════════
    function clearProgress() {
        if (!confirm('確定要清除所有進度？')) return;
        Object.values(CERTS).forEach(c => localStorage.removeItem(c.key));
        localStorage.removeItem('adventure_start');
        localStorage.setItem('adventure_start', Date.now().toString());
        refreshUI();
    }

    // ══════════════════════════════
    // 通關大門 Modal
    // ══════════════════════════════
    const slotFilled = { dynasty: false, idiom: false, warrior: false };

    function openGateModal() {
        Object.keys(slotFilled).forEach(k => slotFilled[k] = false);
        document.querySelectorAll('.slot-well').forEach(s => {
            s.innerHTML = ''; s.classList.remove('filled', 'error-flash');
        });
        buildBackpack();
        document.getElementById('gate-modal-overlay').classList.add('active');
    }
    function closeGateModal() {
        document.getElementById('gate-modal-overlay').classList.remove('active');
    }

    function buildBackpack() {
        const row = document.getElementById('backpack-row');
        row.innerHTML = '';
        const available = Object.entries(CERTS).filter(([id, c]) =>
            localStorage.getItem(c.key) && !slotFilled[id]
        );
        if (available.length === 0) {
            row.innerHTML = '<div class="empty-backpack">背包空空…<br>先去完成關卡！</div>';
            return;
        }
        available.forEach(([id, cert]) => row.appendChild(createBadge(id, cert)));
    }

    function createBadge(id, cert) {
        const badge = document.createElement('div');
        badge.className = 'cert-badge';
        badge.dataset.certId = id;
        badge.draggable = true;
        badge.innerHTML = `${cert.emoji}<span>${cert.name}</span>`;
        badge.addEventListener('dragstart', badgeDragStart);
        badge.addEventListener('dragend',   badgeDragEnd);
        badge.addEventListener('pointerdown', badgePointerDown);
        return badge;
    }

    // ── 桌機 Drag ──
    let currentDragId = null;
    function badgeDragStart(e) {
        currentDragId = this.dataset.certId;
        e.dataTransfer.setData('text/plain', currentDragId);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => this.style.opacity = '0.4', 0);
    }
    function badgeDragEnd(e) { this.style.opacity = '1'; currentDragId = null; }

    function slotDragOver(e, el)  { e.preventDefault(); el.classList.add('drag-over'); }
    function slotDragLeave(el)    { el.classList.remove('drag-over'); }
    function slotDrop(e, el) {
        e.preventDefault(); el.classList.remove('drag-over');
        attemptDrop(e.dataTransfer.getData('text/plain') || currentDragId, el);
    }

    // ── 觸控 Pointer ──
    let touchBadge = null, touchGhost = null;
    let touchStartX = 0, touchStartY = 0, touchInitL = 0, touchInitT = 0;

    function badgePointerDown(e) {
        if (e.pointerType === 'mouse') return;
        e.preventDefault();
        touchBadge = this;
        const rect = this.getBoundingClientRect();
        touchStartX = e.clientX; touchStartY = e.clientY;
        touchInitL = rect.left;  touchInitT = rect.top;

        touchGhost = this.cloneNode(true);
        touchGhost.className = 'cert-badge dragging-badge';
        touchGhost.style.left   = rect.left + 'px';
        touchGhost.style.top    = rect.top  + 'px';
        touchGhost.style.width  = rect.width + 'px';
        touchGhost.style.height = rect.height + 'px';
        document.body.appendChild(touchGhost);
        this.classList.add('ghost');

        document.addEventListener('pointermove', touchMove, { passive: false });
        document.addEventListener('pointerup',   touchEnd);
        document.addEventListener('pointercancel', touchEnd);
    }
    function touchMove(e) {
        if (!touchGhost) return;
        if (e.pointerType === 'touch') e.preventDefault();
        touchGhost.style.left = (touchInitL + e.clientX - touchStartX) + 'px';
        touchGhost.style.top  = (touchInitT + e.clientY - touchStartY) + 'px';
    }
    function touchEnd(e) {
        document.removeEventListener('pointermove', touchMove);
        document.removeEventListener('pointerup',   touchEnd);
        document.removeEventListener('pointercancel', touchEnd);
        if (!touchGhost || !touchBadge) return;
        touchGhost.style.display = 'none';
        const target = document.elementFromPoint(e.clientX, e.clientY);
        touchGhost.style.display = '';
        const well = target ? target.closest('.slot-well') : null;
        if (well) attemptDrop(touchBadge.dataset.certId, well);
        touchBadge.classList.remove('ghost');
        touchGhost.remove(); touchGhost = null; touchBadge = null;
    }

    // ── 放置判斷 ──
    function attemptDrop(certId, well) {
        const accept = well.dataset.accept;
        if (slotFilled[accept]) return;
        if (certId === accept) {
            slotFilled[accept] = true;
            well.innerHTML = CERTS[accept].emoji;
            well.classList.add('filled');
            buildBackpack();
            if (Object.values(slotFilled).every(v => v)) {
                setTimeout(() => { window.location.href = 'ending.html'; }, 600);
            }
        } else {
            well.classList.add('error-flash');
            setTimeout(() => well.classList.remove('error-flash'), 400);
        }
    }

    // ══════════════════════════════
    // 通關畫面
    // ══════════════════════════════
    function showWinScreen() {
        const start   = parseInt(localStorage.getItem('adventure_start') || Date.now());
        const elapsed = Math.floor((Date.now() - start) / 1000);
        const mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const ss = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('win-duration').textContent = `${mm} 分 ${ss} 秒`;
        document.getElementById('win-screen').classList.add('active');
        launchConfetti();
    }

    function restartAdventure() {
        Object.values(CERTS).forEach(c => localStorage.removeItem(c.key));
        localStorage.removeItem('adventure_start');
        sessionStorage.removeItem('splash_seen');   // ← 下次重玩會再顯示封面
        document.getElementById('win-screen').classList.remove('active');
        document.getElementById('confetti-wrap').innerHTML = '';
        // 回到封面
        showSplash();
        localStorage.setItem('adventure_start', Date.now().toString());
    }

    // ══════════════════════════════
    // 彩帶
    // ══════════════════════════════
    function launchConfetti() {
        const wrap = document.getElementById('confetti-wrap');
        wrap.innerHTML = '';
        const colors = ['#f5c842','#27ae60','#e74c3c','#3498db','#9b59b6','#1abc9c','#e67e22'];
        for (let i = 0; i < 90; i++) {
            const p = document.createElement('div');
            p.className = 'confetti-particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.animationDuration = (2 + Math.random() * 3) + 's';
            p.style.animationDelay    = (Math.random() * 2) + 's';
            const size = 8 + Math.random() * 8;
            p.style.width = size + 'px'; p.style.height = size + 'px';
            wrap.appendChild(p);
        }
    }
    </script>
</body>
</html>
